ng\":{\"id\":14659,\"talk\":\"helen_fisher_the_brain_in_love\",\"tag\":\"brain,cognitive science,culture,literature,love,poetry,psychology,relationships,science,technology\",\"year\":\"2008\",\"event\":\"TED2008\"},\"canonical\":\"https://www.ted.com/talks/helen_fisher_the_brain_in_love\",\"name\":\"Helen Fisher: The brain in love\",\"title\":\"The brain in love\",\"speaker\":\"Helen Fisher\",\"thumb\":\"https://pe.tedcdn.com/images/ted/28904d13789baad0eb5f3d91b16ee67898b96892_2400x1800.jpg\",\"slug\":\"helen_fisher_the_brain_in_love\",\"event\":\"TED2008\",\"published\":1216083600,\"dubbedVideoStreams\":{},\"external\":{\"service\":\"YouTube\",\"code\":\"OYfoGTIG7pY\",\"duration\":\"988.0\",\"start_time\":\"0.0\"}}","hlsUrl":"https://hls.ted.com/project_masters/2318/manifest.m3u8?intro_master_id=9294","takeaways":{"__typename":"TalkTakeawayConnection","nodes":[{"__typename":"TalkTakeaway","id":"28936","text":"{\"headline\":\"Romantic Love Hijacks The Brain Like An Addiction\",\"body\":\"Romantic love lights up the same deep brain circuits as powerful drugs, driving obsession, craving, and even pain when rejected. MRI scans reveal that people in love, and even those still devoted after 25 years, show intense activity in the brain\u2019s reward and attachment centers. Nearly everyone is affected\u201495 percent of people have both loved deeply and been rejected\u2014showing that the drive for love is universal. Our biology shapes who we desire, as much as our upbringing or culture.\",\"bullets\":[\"Romantic love activates dopamine-driven brain regions linked to motivation and reward.\",\"Heartbreak intensifies the obsession, making lost love even harder to escape.\",\"Long-term love can sustain passionate brain activity for decades.\",\"Humans and animals both show selective attraction, pointing to deep biological roots.\",\"Falling for someone is influenced by brain chemistry and personality, not just social background.\"]}","talkstarTalkId":307,"offsetSeconds":0,"ttVersion":2,"active":true}]},"talkExtras":{"__typename":"TalkExtras","learnModules":[],"takeAction":[],"recommendations":[]},"relatedVideos":[{"__typename":"Video","slug":"helen_fisher_why_we_love_why_we_cheat","id":"16"},{"__typename":"Video","slug":"dan_gilbert_the_surprising_science_of_happiness","id":"97"},{"__typename":"Video","slug":"chris_abani_telling_stories_from_africa","id":"155"}],"speakers":{"__typename":"AcmeSpeakerConnection","nodes":[{"__typename":"AcmeSpeaker","photoUrl":"https://pe.tedcdn.com/images/ted/a390d3e37a2f9f68f9a2f4f664e66bc694d7a699_254x191.jpg","firstname":"Helen","middlename":"","lastname":"Fisher","description":"Anthropologist, expert on love","isLive":true,"title":"","whatOthersSay":"In hands as skilled and sensitive as Fisher's, scientific analysis of love only adds to its magic.","whoTheyAre":"Anthropologist Helen Fisher studies gender differences and the evolution of human emotions. She\u2019s best known as an expert on romantic love.","whyListen":"<p class=\"p1\">Fisher&#39;s several books lay bare the mysteries of our most treasured emotion: its evolution, its biochemical foundations and its vital importance to human society. Fisher describes love as a universal human drive (stronger than the sex drive; stronger than thirst or hunger; stronger perhaps than the will to live), and her many areas of inquiry shed light on timeless human mysteries like why we choose one partner over another. Her classic study,&nbsp;<a href=\"https://www.amazon.com/Anatomy-Love-Marriage-Completely-Introduction/dp/0393285227\" target=\"_blank\"><em>Anatomy of Love</em></a>, first published in 1992, has just been re-issued in a fully updated edition, including her recent neuroimaging research on lust, romantic love and attachment as well as discussions of sexting, hooking up, friends with benefits, other contemporary trends in courtship and marriage, and a dramatic current trend she calls &ldquo;slow love.&rdquo;</p>","slug":"helen_fisher"}]},"type":{"__typename":"VideoKind","id":"1","name":"TED Stage Talk"},"description":"Why do we crave love so much, even to the point that we would die for it? To learn more about our very real, very physical need for romantic love, Helen Fisher and her research team took MRIs of people in love -- and people who had just been dumped.","socialTitle":"The brain in love","internalLanguageCode":"en","commentsEnabled":false,"commentsLoggedInOnly":false,"recordedOn":"2008-02-02","curatorApproved":true,"socialDescription":"Why do we crave love so much, even to the point that we would die for it? To learn more about our very real, very physical need for romantic love, Helen Fisher and her research team took MRIs of people in love -- and people who had just been dumped.","partnerName":null,"videoContext":"TED2008","audioInternalLanguageCode":"en","language":"en","hasTranslations":true,"featured":true,"customPartnerContent":null,"topics":{"__typename":"TopicConnection","nodes":[{"__typename":"Topic","id":"154","name":"brain","slug":"brain"},{"__typename":"Topic","id":"70","name":"cognitive science","slug":"cognitive+science"},{"__typename":"Topic","id":"4","name":"culture","slug":"culture"},{"__typename":"Topic","id":"195","name":"literature","slug":"literature"},{"__typename":"Topic","id":"73","name":"love","slug":"love"},{"__typename":"Topic","id":"97","name":"poetry","slug":"poetry"},{"__typename":"Topic","id":"74","name":"psychology","slug":"psychology"},{"__typename":"Topic","id":"75","name":"relationships","slug":"relationships"},{"__typename":"Topic","id":"8","name":"science","slug":"science"},{"__typename":"Topic","id":"10","name":"technology","slug":"technology"}]},"presenterDisplayName":"Helen Fisher","duration":936,"canonicalUrl":"https://www.ted.com/talks/helen_fisher_the_brain_in_love","hasDubbedStreams":false,"viewedCount":7775228,"tedcomPercentage":"0.57","youtubePercentage":"0.265","podcastsPercentage":"0.006","tedappsPercentage":"0.159","publishedAt":"2008-07-15T01:00:00Z","id":"307","title":"The brain in love","slug":"helen_fisher_the_brain_in_love","primaryImageSet":[{"__typename":"PhotoSize","url":"https://pe.tedcdn.com/images/ted/28904d13789baad0eb5f3d91b16ee67898b96892_2400x1800.jpg","aspectRatioName":"4x3"},{"__typename":"PhotoSize","url":"https://pe.tedcdn.com/images/ted/dfda28474d713d1de50dd1cc5f67c299c8b6eb80_2880x1620.jpg","aspectRatioName":"16x9"}]},"transcriptData":{"translation":{"__typename":"Translation","paragraphs":[{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"I and my colleagues Art Aron\nand Lucy Brown and others,","time":871},{"__typename":"Cue","text":"have put 37 people who are madly in love\ninto a functional MRI brain scanner.","time":4538},{"__typename":"Cue","text":"17 who were happily in love,\n15 who had just been dumped,","time":9121},{"__typename":"Cue","text":"and we're just starting\nour third experiment:","time":13038},{"__typename":"Cue","text":"studying people who report\nthat they're still in love","time":15204},{"__typename":"Cue","text":"after 10 to 25 years of marriage.","time":17704},{"__typename":"Cue","text":"So, this is the short story\nof that research.","time":19996}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"In the jungles of Guatemala,\nin Tikal, stands a temple.","time":24538},{"__typename":"Cue","text":"It was built by the grandest Sun King,\nof the grandest city-state,","time":29121},{"__typename":"Cue","text":"of the grandest civilization\nof the Americas, the Mayas.","time":34121},{"__typename":"Cue","text":"His name was Jasaw Chan K'awiil.","time":38746},{"__typename":"Cue","text":"He stood over six feet tall.","time":41454},{"__typename":"Cue","text":"He lived into his 80s,","time":43787},{"__typename":"Cue","text":"and he was buried beneath\nthis monument in 720 AD.","time":45829},{"__typename":"Cue","text":"And Mayan inscriptions proclaim\nthat he was deeply in love with his wife.","time":50162},{"__typename":"Cue","text":"So, he built a temple\nin her honor, facing his.","time":54246},{"__typename":"Cue","text":"And every spring and autumn,\nexactly at the equinox,","time":58121},{"__typename":"Cue","text":"the sun rises behind his temple,","time":62121},{"__typename":"Cue","text":"and perfectly bathes her temple\nwith his shadow.","time":64579},{"__typename":"Cue","text":"And as the sun sets\nbehind her temple in the afternoon,","time":69621},{"__typename":"Cue","text":"it perfectly bathes\nhis temple with her shadow.","time":73413},{"__typename":"Cue","text":"After 1,300 years, these two lovers\nstill touch and kiss from their tomb.","time":77413}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"Around the world, people love.","time":84454},{"__typename":"Cue","text":"They sing for love, they dance for love,","time":86788},{"__typename":"Cue","text":"they compose poems and stories about love.","time":89538},{"__typename":"Cue","text":"They tell myths and legends about love.","time":92579},{"__typename":"Cue","text":"They pine for love, they live for love,\nthey kill for love, and they die for love.","time":95204},{"__typename":"Cue","text":"As Walt Whitman once said,\n\"O I would stake all for you.\"","time":101038},{"__typename":"Cue","text":"Anthropologists have found evidence\nof romantic love in 170 societies.","time":105788},{"__typename":"Cue","text":"They've never found a society\nthat did not have it.","time":109996}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"But love isn't always a happy experience.","time":114121},{"__typename":"Cue","text":"In one study of college students,\nthey asked a lot of questions about love,","time":116829},{"__typename":"Cue","text":"but the two that stood out\nto me the most were:","time":120746},{"__typename":"Cue","text":"\"Have you ever been rejected\nby somebody who you really loved?\"","time":123704},{"__typename":"Cue","text":"And the second question was:","time":128371},{"__typename":"Cue","text":"\"Have you ever dumped somebody\nwho really loved you?\"","time":129788},{"__typename":"Cue","text":"And almost 95 percent of both men\nand women said yes to both.","time":133621},{"__typename":"Cue","text":"Almost nobody gets out of love alive.","time":138913}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So, before I start telling you\nabout the brain,","time":142538},{"__typename":"Cue","text":"I want to read for you","time":145788},{"__typename":"Cue","text":"what I think is the most powerful\nlove poem on Earth.","time":147288},{"__typename":"Cue","text":"There's other love poems that are,\nof course, just as good,","time":149996},{"__typename":"Cue","text":"but I don't think this one\ncan be surpassed.","time":152829},{"__typename":"Cue","text":"It was told by an anonymous\nKwakiutl Indian of southern Alaska","time":155413},{"__typename":"Cue","text":"to a missionary in 1896.","time":160163},{"__typename":"Cue","text":"And here it is.","time":163621},{"__typename":"Cue","text":"I've never had the opportunity\nto say it before.","time":164871},{"__typename":"Cue","text":"\"Fire runs through my body\nwith the pain of loving you.","time":168496},{"__typename":"Cue","text":"Pain runs through my body\nwith the fires of my love for you.","time":172538},{"__typename":"Cue","text":"Pain like a boil about to burst\nwith my love for you,","time":176621},{"__typename":"Cue","text":"consumed by fire with my love for you.","time":180496},{"__typename":"Cue","text":"I remember what you said to me.","time":183621},{"__typename":"Cue","text":"I am thinking of your love for me.","time":185746},{"__typename":"Cue","text":"I am torn by your love for me.","time":187871},{"__typename":"Cue","text":"Pain and more pain --","time":190204},{"__typename":"Cue","text":"where are you going with my love?","time":192163},{"__typename":"Cue","text":"I am told you will go from here.","time":194246},{"__typename":"Cue","text":"I am told you will leave me here.","time":196038},{"__typename":"Cue","text":"My body is numb with grief.","time":198496},{"__typename":"Cue","text":"Remember what I said, my love.","time":200704},{"__typename":"Cue","text":"Goodbye, my love, goodbye.\"","time":202788},{"__typename":"Cue","text":"Emily Dickinson once wrote,\n\"Parting is all we need to know of hell.\"","time":206621},{"__typename":"Cue","text":"How many people have suffered","time":212871},{"__typename":"Cue","text":"in all the millions of years\nof human evolution?","time":214996},{"__typename":"Cue","text":"How many people around the world","time":218621},{"__typename":"Cue","text":"are dancing with elation\nat this very minute?","time":220788},{"__typename":"Cue","text":"Romantic love is one of the most powerful\nsensations on Earth.","time":224121}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So, several years ago,\nI decided to look into the brain","time":228371},{"__typename":"Cue","text":"and study this madness.","time":231829},{"__typename":"Cue","text":"Our first study of people\nwho were happily in love","time":234704},{"__typename":"Cue","text":"has been widely publicized,","time":237288},{"__typename":"Cue","text":"so I'm only going to say\nvery little about it.","time":238663},{"__typename":"Cue","text":"We found activity in a tiny,\nlittle factory near the base of the brain","time":241163},{"__typename":"Cue","text":"called the ventral tegmental area.","time":245163},{"__typename":"Cue","text":"We found activity in some cells\ncalled the A10 cells,","time":247371},{"__typename":"Cue","text":"cells that actually make\ndopamine, a natural stimulant,","time":250538},{"__typename":"Cue","text":"and spray it to many brain regions.","time":253454},{"__typename":"Cue","text":"Indeed, this part, the VTA,\nis part of the brain's reward system.","time":255788},{"__typename":"Cue","text":"It's way below your cognitive\nthinking process.","time":259913},{"__typename":"Cue","text":"It's below your emotions.","time":262496},{"__typename":"Cue","text":"It's part of what we call\nthe reptilian core of the brain,","time":264121},{"__typename":"Cue","text":"associated with wanting, with motivation,\nwith focus and with craving.","time":267371},{"__typename":"Cue","text":"In fact, the same brain region\nwhere we found activity","time":272663},{"__typename":"Cue","text":"becomes active also\nwhen you feel the rush of cocaine.","time":275788}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"But romantic love is much more\nthan a cocaine high --","time":279663},{"__typename":"Cue","text":"at least you come down from cocaine.","time":282621},{"__typename":"Cue","text":"Romantic love is an obsession,\nit possesses you.","time":284954},{"__typename":"Cue","text":"You lose your sense of self.","time":288246},{"__typename":"Cue","text":"You can't stop thinking\nabout another human being.","time":289954},{"__typename":"Cue","text":"Somebody is camping in your head.","time":293329},{"__typename":"Cue","text":"As an eighth-century Japanese poet said,\n\"My longing had no time when it ceases.\"","time":295746},{"__typename":"Cue","text":"Wild is love.","time":302329},{"__typename":"Cue","text":"And the obsession can get worse\nwhen you've been rejected.","time":304663}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So, right now, Lucy Brown and I,\nthe neuroscientists on our project,","time":308288},{"__typename":"Cue","text":"are looking at the data of the people","time":312996},{"__typename":"Cue","text":"who were put into the machine\nafter they had just been dumped.","time":314996},{"__typename":"Cue","text":"It was very difficult actually,\nputting these people in the machine,","time":318371},{"__typename":"Cue","text":"because they were in such bad shape.","time":321579}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"(Laughter)","time":323329}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So anyway, we found activity\nin three brain regions.","time":326996},{"__typename":"Cue","text":"We found activity in the brain region,","time":329621},{"__typename":"Cue","text":"in exactly the same brain region\nassociated with intense romantic love.","time":332121},{"__typename":"Cue","text":"What a bad deal.","time":336746},{"__typename":"Cue","text":"You know, when you've been dumped,","time":338663},{"__typename":"Cue","text":"the one thing you love to do\nis just forget about this human being,","time":340329},{"__typename":"Cue","text":"and then go on with your life --\nbut no, you just love them harder.","time":343538},{"__typename":"Cue","text":"As the poet Terence,\nthe Roman poet once said,","time":347579},{"__typename":"Cue","text":"he said, \"The less my hope,\nthe hotter my love.\"","time":351163},{"__typename":"Cue","text":"And indeed, we now know why.","time":354204},{"__typename":"Cue","text":"Two thousand years later,\nwe can explain this in the brain.","time":356496},{"__typename":"Cue","text":"That brain system -- the reward system","time":359746},{"__typename":"Cue","text":"for wanting, for motivation,\nfor craving, for focus --","time":362163},{"__typename":"Cue","text":"becomes more active\nwhen you can't get what you want.","time":365996},{"__typename":"Cue","text":"In this case, life's greatest prize:\nan appropriate mating partner.","time":369496}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"We found activity\nin other brain regions also --","time":374246},{"__typename":"Cue","text":"in a brain region associated\nwith calculating gains and losses.","time":377038},{"__typename":"Cue","text":"You're lying there,\nyou're looking at the picture,","time":381954},{"__typename":"Cue","text":"and you're in this machine,","time":384329},{"__typename":"Cue","text":"and you're calculating what went wrong.","time":385663},{"__typename":"Cue","text":"What have I lost?","time":387871},{"__typename":"Cue","text":"As a matter of fact, Lucy and I\nhave a little joke about this.","time":390454},{"__typename":"Cue","text":"It comes from a David Mamet play,","time":394121},{"__typename":"Cue","text":"and there's two con artists in the play,","time":396996},{"__typename":"Cue","text":"and the woman is conning the man,","time":399079},{"__typename":"Cue","text":"and the man looks at the woman and says,","time":400996},{"__typename":"Cue","text":"\"Oh, you're a bad pony,\nI'm not going to bet on you.\"","time":403204},{"__typename":"Cue","text":"And indeed, it's this part of the brain,","time":408163},{"__typename":"Cue","text":"the core of the nucleus accumbens,","time":410788},{"__typename":"Cue","text":"that is becoming active\nas you're measuring your gains and losses.","time":412704},{"__typename":"Cue","text":"It's also the brain region\nthat becomes active","time":416329},{"__typename":"Cue","text":"when you're willing to take enormous risks\nfor huge gains and huge losses.","time":418704}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"Last but not least,\nwe found activity in a brain region","time":423621},{"__typename":"Cue","text":"associated with deep attachment\nto another individual.","time":426913},{"__typename":"Cue","text":"No wonder people suffer around the world,\nand we have so many crimes of passion.","time":431579},{"__typename":"Cue","text":"When you've been rejected in love,","time":437746},{"__typename":"Cue","text":"not only are you engulfed\nwith feelings of romantic love,","time":439871},{"__typename":"Cue","text":"but you're feeling deep\nattachment to this individual.","time":443829},{"__typename":"Cue","text":"Moreover, this brain circuit\nfor reward is working,","time":446579},{"__typename":"Cue","text":"and you're feeling intense energy,\nintense focus, intense motivation","time":449871},{"__typename":"Cue","text":"and the willingness to risk it all,\nto win life's greatest prize.","time":455079}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So, what have I learned\nfrom this experiment","time":461454},{"__typename":"Cue","text":"that I would like to tell the world?","time":464371},{"__typename":"Cue","text":"Foremost, I have come to think","time":466121},{"__typename":"Cue","text":"that romantic love is a drive,\na basic mating drive.","time":468538},{"__typename":"Cue","text":"Not the sex drive --","time":471996},{"__typename":"Cue","text":"the sex drive gets you looking\nfor a whole range of partners.","time":473204},{"__typename":"Cue","text":"Romantic love enables you\nto focus your mating energy","time":476079},{"__typename":"Cue","text":"on just one at a time,\nconserve your mating energy,","time":478621},{"__typename":"Cue","text":"and start the mating process\nwith this single individual.","time":481413},{"__typename":"Cue","text":"I think of all the poetry\nthat I've read about romantic love,","time":485121},{"__typename":"Cue","text":"what sums it up best\nis something that is said by Plato","time":488746},{"__typename":"Cue","text":"over 2,000 years ago.","time":492579},{"__typename":"Cue","text":"He said, \"The god of love\nlives in a state of need.","time":494746},{"__typename":"Cue","text":"It is a need, it is an urge,\nit is a homeostatic imbalance.","time":498829},{"__typename":"Cue","text":"Like hunger and thirst,\nit's almost impossible to stamp out.\"","time":504163},{"__typename":"Cue","text":"I've also come to believe\nthat romantic love is an addiction:","time":509079},{"__typename":"Cue","text":"a perfectly wonderful addiction\nwhen it's going well,","time":512371},{"__typename":"Cue","text":"and a perfectly horrible addiction\nwhen it's going poorly.","time":514954}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"And indeed, it has all\nof the characteristics of addiction.","time":518037},{"__typename":"Cue","text":"You focus on the person,\nyou obsessively think about them,","time":520871},{"__typename":"Cue","text":"you crave them, you distort reality,","time":524246},{"__typename":"Cue","text":"your willingness to take enormous\nrisks to win this person.","time":526996},{"__typename":"Cue","text":"And it's got the three main\ncharacteristics of addiction:","time":530329},{"__typename":"Cue","text":"tolerance, you need to see them\nmore, and more, and more;","time":533037},{"__typename":"Cue","text":"withdrawals;","time":535746},{"__typename":"Cue","text":"and last: relapse.","time":537287},{"__typename":"Cue","text":"I've got a girlfriend who's just\ngetting over a terrible love affair.","time":538704},{"__typename":"Cue","text":"It's been about eight months,\nshe's beginning to feel better.","time":542371},{"__typename":"Cue","text":"And she was driving along\nin her car the other day,","time":545287},{"__typename":"Cue","text":"and suddenly she heard a song\non the car radio","time":547746},{"__typename":"Cue","text":"that reminded her of this man.","time":549954},{"__typename":"Cue","text":"Not only did the instant\ncraving come back,","time":551412},{"__typename":"Cue","text":"but she had to pull over\nfrom the side of the road and cry.","time":554287},{"__typename":"Cue","text":"So, one thing I would like\nthe medical community,","time":558371},{"__typename":"Cue","text":"and the legal community,\nand even the college community,","time":560746},{"__typename":"Cue","text":"to see if they can understand,\nthat indeed, romantic love","time":563496},{"__typename":"Cue","text":"is one of the most addictive\nsubstances on Earth.","time":567329}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"I would also like to tell the world\nthat animals love.","time":570412},{"__typename":"Cue","text":"There's not an animal on this planet","time":574121},{"__typename":"Cue","text":"that will copulate with anything\nthat comes along.","time":576329},{"__typename":"Cue","text":"Too old, too young, too scruffy,\ntoo stupid, and they won't do it.","time":578746},{"__typename":"Cue","text":"Unless you're stuck\nin a laboratory cage --","time":583454},{"__typename":"Cue","text":"and you know, if you spend\nyour entire life in a little box,","time":585996},{"__typename":"Cue","text":"you're not going to be as picky\nabout who you have sex with,","time":589704},{"__typename":"Cue","text":"but I've looked in a hundred species,","time":592996},{"__typename":"Cue","text":"and everywhere in the wild,\nanimals have favorites.","time":595912},{"__typename":"Cue","text":"As a matter of fact,\nethologists know this.","time":598996},{"__typename":"Cue","text":"There are over eight words\nfor what they call \"animal favoritism:\"","time":601037},{"__typename":"Cue","text":"selective proceptivity, mate choice,\nfemale choice, sexual choice.","time":604996},{"__typename":"Cue","text":"And indeed, there are now\nthree academic articles","time":610496},{"__typename":"Cue","text":"in which they've looked\nat this attraction,","time":613496},{"__typename":"Cue","text":"which may only last for a second,","time":615996},{"__typename":"Cue","text":"but it's a definite attraction,","time":617996},{"__typename":"Cue","text":"and either this same brain region,\nthis reward system,","time":619746},{"__typename":"Cue","text":"or the chemicals of that reward\nsystem are involved.","time":623037},{"__typename":"Cue","text":"In fact, I think animal attraction\ncan be instant --","time":626621},{"__typename":"Cue","text":"you can see an elephant\ninstantly go for another elephant.","time":629246},{"__typename":"Cue","text":"And I think that this is really the origin","time":631996},{"__typename":"Cue","text":"of what you and I call\n\"love at first sight.\"","time":634037}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"People have often asked me","time":638454},{"__typename":"Cue","text":"whether what I know about love\nhas spoiled it for me.","time":640579},{"__typename":"Cue","text":"And I just simply say, \"Hardly.\"","time":644621},{"__typename":"Cue","text":"You can know every single ingredient\nin a piece of chocolate cake,","time":646621},{"__typename":"Cue","text":"and then when you sit down\nand eat that cake,","time":649787},{"__typename":"Cue","text":"you can still feel that joy.","time":652496},{"__typename":"Cue","text":"And certainly, I make all the same\nmistakes that everybody else does too,","time":654329},{"__typename":"Cue","text":"but it's really deepened my understanding","time":658037},{"__typename":"Cue","text":"and compassion, really,\nfor all human life.","time":662287},{"__typename":"Cue","text":"As a matter of fact, in New York,\nI often catch myself","time":666246},{"__typename":"Cue","text":"looking in baby carriages\nand feeling a little sorry for the tot.","time":669496},{"__typename":"Cue","text":"And in fact, sometimes\nI feel a little sorry","time":673079},{"__typename":"Cue","text":"for the chicken on my dinner plate,","time":675996},{"__typename":"Cue","text":"when I think of how intense\nthis brain system is.","time":678037},{"__typename":"Cue","text":"Our newest experiment has been hatched","time":683246},{"__typename":"Cue","text":"by my colleague, Art Aron --","time":687954},{"__typename":"Cue","text":"putting people who are reporting\nthat they are still in love,","time":690621},{"__typename":"Cue","text":"in a long-term relationship,\ninto the functional MRI.","time":693787},{"__typename":"Cue","text":"We've put five people in so far,","time":696954},{"__typename":"Cue","text":"and indeed, we found exactly\nthe same thing.","time":699329},{"__typename":"Cue","text":"They're not lying.","time":702412},{"__typename":"Cue","text":"The brain areas associated\nwith intense romantic love","time":703787},{"__typename":"Cue","text":"still become active, 25 years later.","time":709787}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"There are still many questions\nto be answered","time":714537},{"__typename":"Cue","text":"and asked about romantic love.","time":716996},{"__typename":"Cue","text":"The question that I'm working on\nright this minute --","time":719746},{"__typename":"Cue","text":"and I'm only going to say it\nfor a second, and then end --","time":722287},{"__typename":"Cue","text":"is, why do you fall in love\nwith one person, rather than another?","time":725079},{"__typename":"Cue","text":"I never would have\neven thought to think of this,","time":728162},{"__typename":"Cue","text":"but Match.com, the Internet dating site,","time":730996},{"__typename":"Cue","text":"came to me three years ago\nand asked me that question.","time":732996},{"__typename":"Cue","text":"And I said, I don't know.","time":735829},{"__typename":"Cue","text":"I know what happens in the brain,\nwhen you do become in love,","time":737162},{"__typename":"Cue","text":"but I don't know why you fall in love\nwith one person rather than another.","time":740579},{"__typename":"Cue","text":"And so, I've spent\nthe last three years on this.","time":744121},{"__typename":"Cue","text":"And there are many reasons\nthat you fall in love with one person","time":746912},{"__typename":"Cue","text":"rather than another,\nthat psychologists can tell you.","time":749912},{"__typename":"Cue","text":"And we tend to fall in love with somebody\nfrom the same socioeconomic background,","time":752454},{"__typename":"Cue","text":"the same general level of intelligence,\nof good looks, the same religious values.","time":756287},{"__typename":"Cue","text":"Your childhood certainly plays a role,\nbut nobody knows how.","time":760162},{"__typename":"Cue","text":"And that's about it, that's all they know.","time":762996},{"__typename":"Cue","text":"No, they've never found","time":765162},{"__typename":"Cue","text":"the way two personalities\nfit together to make a good relationship.","time":766829}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So, it began to occur to me","time":771204},{"__typename":"Cue","text":"that maybe your biology pulls you\ntowards some people rather than another.","time":772996},{"__typename":"Cue","text":"And I have concocted a questionnaire\nto see to what degree","time":778079},{"__typename":"Cue","text":"you express dopamine, serotonin,\nestrogen and testosterone.","time":782621},{"__typename":"Cue","text":"I think we've evolved four\nvery broad personality types","time":786996},{"__typename":"Cue","text":"associated with the ratios\nof these four chemicals in the brain.","time":790287},{"__typename":"Cue","text":"And on this dating site\nthat I have created, called Chemistry.com,","time":794412},{"__typename":"Cue","text":"I ask you first a series of questions","time":798621},{"__typename":"Cue","text":"to see to what degree\nyou express these chemicals,","time":802287},{"__typename":"Cue","text":"and I'm watching who chooses who to love.","time":805412},{"__typename":"Cue","text":"And 3.7 million people have taken\nthe questionnaire in America.","time":808996},{"__typename":"Cue","text":"About 600,000 people have taken it\nin 33 other countries.","time":813412},{"__typename":"Cue","text":"I'm putting the data together now,","time":817829},{"__typename":"Cue","text":"and at some point --\nthere will always be magic to love,","time":819537},{"__typename":"Cue","text":"but I think I will come closer\nto understanding","time":822871},{"__typename":"Cue","text":"why it is you can walk into a room\nand everybody is from your background,","time":826287},{"__typename":"Cue","text":"your same general level\nof intelligence, good looks,","time":830621},{"__typename":"Cue","text":"and you don't feel\npulled towards all of them.","time":834162},{"__typename":"Cue","text":"I think there's biology to that.","time":836371},{"__typename":"Cue","text":"I think we're going to end up,\nin the next few years,","time":838287},{"__typename":"Cue","text":"to understand all kinds\nof brain mechanisms","time":840871},{"__typename":"Cue","text":"that pull us to one person\nrather than another.","time":843079}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"So, I will close with this.","time":846412},{"__typename":"Cue","text":"These are my older people.","time":848829},{"__typename":"Cue","text":"Faulkner said, \"The past is not dead,\nit's not even past.\"","time":851954},{"__typename":"Cue","text":"Indeed, we carry a lot of luggage\nfrom our yesteryear in the human brain.","time":857412},{"__typename":"Cue","text":"And so, there's one thing that makes me\npursue my understanding of human nature,","time":862412},{"__typename":"Cue","text":"and this reminds me of it.","time":869787},{"__typename":"Cue","text":"These are two women.","time":871787},{"__typename":"Cue","text":"Women tend to get intimacy\ndifferently than men do.","time":873246},{"__typename":"Cue","text":"Women get intimacy\nfrom face-to-face talking.","time":876412},{"__typename":"Cue","text":"We swivel towards each other,","time":878704},{"__typename":"Cue","text":"we do what we call\nthe \"anchoring gaze\" and we talk.","time":880621},{"__typename":"Cue","text":"This is intimacy to women.","time":884746},{"__typename":"Cue","text":"I think it comes from millions of years","time":886329},{"__typename":"Cue","text":"of holding that baby\nin front of your face,","time":888246},{"__typename":"Cue","text":"cajoling it, reprimanding it,\neducating it with words.","time":890329},{"__typename":"Cue","text":"Men tend to get intimacy\nfrom side-by-side doing.","time":893787},{"__typename":"Cue","text":"As soon as one guy looks up,\nthe other guy will look away.","time":897371}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"(Laughter)","time":900787}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"I think it comes from millions of years\nsitting behind the bush,","time":902496},{"__typename":"Cue","text":"looking straight ahead, trying to hit\nthat buffalo on the head with a rock.","time":907621},{"__typename":"Cue","text":"I think, for millions of years,\nmen faced their enemies,","time":912079},{"__typename":"Cue","text":"they sat side-by-side with friends.","time":914871},{"__typename":"Cue","text":"So my final statement is: love is in us.","time":917621},{"__typename":"Cue","text":"It's deeply embedded in the brain.","time":921912},{"__typename":"Cue","text":"Our challenge is to understand each other.","time":924496}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"Thank you.","time":927329}]},{"__typename":"Paragraph","cues":[{"__typename":"Cue","text":"(Applause)","time":928579}]}],"id":"15341","language":{"__typename":"AcmeLanguage","id":"35","endonym":"English","englishName":"English","internalLanguageCode":"en","rtl":false},"reviewer":null,"translator":null},"video":{"__typename":"Video","id":"307","talkExtras":{"__typename":"TalkExtras","footnotes":[]}}},"playlistData":null,"relatedPlaylists":[{"type":"related","image_url":"https://pi.tedcdn.com/r/talkstar-assets.s3.amazonaws.com/production/playlists/playlist_231/weird_science_of_love.jpg?amp=&quality=82&u%5Ba%5D=0.8&u%5Br%5D=2&u%5Bs%5D=0.5&u%5Bt%5D=0.03&w=1050&w=600c%3D1050%2C550","author":["TED"],"description":"Love often feels inexplicable, the most unpredictable of forces. Using science, math and methodical observation, these speakers offer clues to understanding it.","language":"en","title":"The weird science of love","url":"https://www.ted.com/playlists/231/the_weird_science_of_love","url_path":"/playlists/231/the_weird_science_of_love"},{"type":"related","image_url":"https://pi.tedcdn.com/r/talkstar-assets.s3.amazonaws.com/production/playlists/playlist_524/9354487f-88ce-454b-8f54-ea8095614e26/believe_in_love_2000x2000.jpg?amp=&quality=82&u%5Ba%5D=0.8&u%5Br%5D=2&u%5Bs%5D=0.5&u%5Bt%5D=0.03&w=1050&w=600c%3D1050%2C550","author":["TED"],"description":"After watching these charming talks, it'll feel like love is always just around the corner.","language":"en","title":"Talks to help you believe in love again","url":"https://www.ted.com/playlists/524/talks_to_help_you_believe_in_love_again","url_path":"/playlists/524/talks_to_help_you_believe_in_love_again"},
